<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bug Fixer</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --page:#0D0D0D; --panel:#1A1A1A; --line:#2A2A2A; --cream:#E8E6E1;
    --ink:#141413; --ink-2:#5C5A54; --ink-3:#8A8880;
    --t-1:#E8E6E1; --t-2:#B4B2A9; --t-3:#8A8A8A; --t-4:#6A6A6A; --t-5:#5A5A5A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--page);color:var(--t-1);
       font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
  .page{display:flex;gap:12px;padding:12px;min-height:100vh;border-radius:16px;background:var(--page);}

  /* ── sidebar ─────────────────────────────────────────────────────────── */
  .side{flex:0 0 146px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:16px 12px;display:flex;flex-direction:column;}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--cream);margin-bottom:20px;flex:0 0 auto;}
  .nav{display:flex;flex-direction:column;gap:2px;}
  .navItem{font-size:13px;color:var(--t-3);padding:7px 9px;border-radius:8px;}
  .navItem.on{background:var(--cream);color:var(--page);font-weight:600;}
  .navFoot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);}

  /* ── main column ─────────────────────────────────────────────────────── */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;}
  .head{display:flex;align-items:baseline;gap:10px;padding:2px 2px 0;}
  .head h1{font-size:19px;font-weight:700;color:var(--t-1);margin:0;letter-spacing:-.01em;}
  .head .tag{font-size:12px;color:var(--t-4);}
  .row{display:flex;gap:12px;align-items:stretch;}
  .row.top{align-items:flex-start;}
  .row.col{flex-direction:column;align-items:stretch;}
  .row.col > *{flex:none;width:100%;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;}
  .secLabel{font-size:11px;color:var(--t-4);font-weight:600;letter-spacing:.05em;text-transform:uppercase;}
  .secSub{font-size:11px;color:var(--t-5);margin-top:4px;}

  /* ── status card — the background IS the state colour ────────────────── */
  .status{flex:1.5;min-width:0;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;}
  .stTop{display:flex;align-items:baseline;gap:10px;}
  .stLabel{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
  .stMeta{margin-left:auto;font-size:12px;white-space:nowrap;}
  .stHead{font-size:27px;font-weight:700;line-height:1.12;letter-spacing:-.02em;color:#FFFFFF;margin-top:14px;}
  .stSub{font-size:13px;margin-top:7px;}

  /* ── cream tiles ─────────────────────────────────────────────────────── */
  .tiles{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;}
  .tile{flex:1;background:var(--cream);border-radius:12px;padding:14px 16px;
        display:flex;flex-direction:column;justify-content:center;}
  .tileNum{font-size:23px;font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1.1;}
  .tileSuf{font-size:15px;font-weight:700;color:var(--ink-3);margin-left:6px;letter-spacing:0;}
  .tileLab{font-size:12px;color:var(--ink-2);margin-top:4px;}

  /* ── live feed ───────────────────────────────────────────────────────── */
  .feed{flex:1.5;min-width:0;display:flex;flex-direction:column;}
  .feedBody{margin-top:10px;overflow:auto;max-height:132px;
            font:11px/1.9 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--t-3);}
  .feedBody .now{color:var(--t-1);}
  .feedLine{white-space:pre-wrap;word-break:break-word;}

  /* ── launch card ─────────────────────────────────────────────────────── */
  .launch{flex:1;min-width:0;background:var(--cream);border-radius:12px;padding:16px;
          display:flex;flex-direction:column;justify-content:center;}
  .launchBtn{width:100%;background:var(--ink);color:var(--cream);border:0;border-radius:8px;
             padding:12px 14px;font:600 13px/1.2 inherit;cursor:pointer;}
  .launchBtn:disabled{opacity:.4;cursor:default;}
  .capNote{font-size:11px;color:var(--ink-3);text-align:center;margin-top:9px;}
  .miniRow{display:flex;gap:14px;justify-content:center;margin-top:8px;}
  .mini{font-size:11px;color:var(--ink-3);background:none;border:0;padding:0;cursor:pointer;font-family:inherit;}
  .mini:hover{color:var(--ink-2);text-decoration:underline;}
  .mini.armed{color:#8C2E2D;}

  /* ── queue ───────────────────────────────────────────────────────────── */
  .qRow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
  .qRow:last-child{border-bottom:0;}
  .pill{font-size:10px;font-weight:700;border-radius:20px;min-width:38px;text-align:center;
        padding:3px 8px;flex:0 0 auto;letter-spacing:.03em;}
  .qTitle{font-size:13px;color:var(--t-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .qTitle.on{color:var(--t-1);}
  .qPair{font-size:12px;color:var(--t-4);margin-left:auto;text-align:right;flex:0 0 auto;
         font-family:ui-monospace,Menlo,monospace;}
  .qEmpty{font-size:12px;color:var(--t-5);padding:12px 0 2px;}

  /* ── add a bug ───────────────────────────────────────────────────────── */
  .strip{flex:1;min-width:0;cursor:pointer;display:flex;align-items:center;gap:10px;}
  .stripTitle{font-size:15px;color:var(--t-1);}
  .stripHint{font-size:11px;color:var(--t-5);margin-left:auto;}
  .addHead{display:flex;align-items:baseline;gap:10px;}
  .addHead h3{font-size:15px;font-weight:400;color:var(--t-1);margin:0;}
  .addInstr{font-size:12px;color:var(--t-3);margin-top:10px;}
  textarea{width:100%;margin-top:10px;background:var(--page);color:var(--t-2);
           border:1px solid var(--line);border-radius:8px;padding:11px 12px;resize:vertical;
           font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;}
  textarea:focus{outline:none;border-color:#3A3A3A;}
  textarea::placeholder{color:var(--t-5);}
  .addBtns{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .btn{border:0;border-radius:8px;padding:9px 14px;font:400 13px/1.2 inherit;cursor:pointer;}
  .btn.ghost{background:var(--line);color:var(--t-2);}
  .btn.solid{background:var(--cream);color:var(--ink);font-weight:600;}
  .btn:disabled{opacity:.4;cursor:default;}
  .addTally{font-size:12px;color:var(--t-5);margin-left:4px;}
  .addResults{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
              display:flex;flex-direction:column;gap:9px;}
  .resRow{display:flex;align-items:baseline;gap:10px;}
  .resText{font-size:12px;color:var(--t-2);flex:1;min-width:0;}
  .resWhy{color:var(--t-4);}

  /* ── past runs ───────────────────────────────────────────────────────── */
  .runs{flex:1.2;min-width:0;}
  .runRow{display:flex;align-items:baseline;gap:12px;padding:8px 0;font-size:12px;}
  .runDate{color:var(--t-5);min-width:80px;flex:0 0 80px;}
  .runDesc{color:var(--t-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .runCost{color:var(--t-5);margin-left:auto;}
  .undoBox{margin-top:10px;background:var(--page);border:1px solid var(--line);border-radius:8px;
           padding:10px;font:11px/1.6 ui-monospace,Menlo,monospace;color:var(--t-3);
           white-space:pre-wrap;word-break:break-all;}

  /* ── settings ────────────────────────────────────────────────────────── */
  .setRow{display:flex;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);}
  .setRow:last-child{border-bottom:0;}
  .setLabel{font-size:13px;color:var(--t-1);}
  .setExplain{font-size:11px;color:var(--t-4);margin-top:3px;line-height:1.4;}
  .setCtrl{display:flex;align-items:center;gap:5px;flex:0 0 auto;}
  .setPrefix{font-size:14px;color:var(--t-3);}
  .setInput{width:82px;background:var(--page);color:var(--t-1);border:1px solid var(--line);border-radius:8px;
            padding:8px 10px;font:14px/1.2 inherit;text-align:right;}
  .setInput:focus{outline:none;border-color:#3A3A3A;}
  .toggle{width:42px;height:24px;border-radius:20px;flex:0 0 auto;position:relative;transition:background .15s;}
  .toggle .knob{position:absolute;top:3px;width:18px;height:18px;border-radius:50%;background:#E8E6E1;transition:left .15s;}
  code{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--t-2);word-break:break-all;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

/* ── palette ───────────────────────────────────────────────────────────────
   The status card takes the state colour as its BACKGROUND; the small label
   and the subtitle are light tints of it. Headline is always pure white. */
const STATE = {
  sweeping : { bg:'#2E6FA8', label:'#D6E7F5', sub:'#C7DDF0', name:'Sweeping'  },
  fixing   : { bg:'#BA7517', label:'#FFF0D6', sub:'#FBEBCD', name:'Fixing'    },
  comparing: { bg:'#7F77DD', label:'#E2E0F8', sub:'#D5D2F2', name:'Comparing' },
  stopped  : { bg:'#8C2E2D', label:'#F2CFCE', sub:'#EFC8C7', name:'Stopped'   },
  finished : { bg:'#4B7A1F', label:'#D8ECBE', sub:'#D2E8B4', name:'Finished'  },
  unverified:{ bg:'#7A5C2E', label:'#EEDFC0', sub:'#E4D2AC', name:'Not verified' },  // kept but unmeasured — NOT Finished
  idle     : { bg:'#4A4A48', label:'#D6D4CE', sub:'#C4C2BC', name:'Idle'      },
};
const PILL = {
  NOW : { background:'#BA7517', color:'#0D0D0D' },
  WAIT: { background:'#2A2A2A', color:'#8A8A8A' },
  DONE: { background:'#4B7A1F', color:'#0D0D0D' },
  SKIP: { background:'#2A2A2A', color:'#6A6A6A' },
};

const post = (url, body) => fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{}) }).then(r=>r.json());
const money = n => '$' + (Number(n)||0).toFixed(2);
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const fmtElapsed = sec => {
  if (sec == null) return null;
  const m = Math.floor(sec/60);
  if (m < 1) return sec + 's';
  return m < 60 ? m + 'm' : Math.floor(m/60) + 'h ' + (m%60) + 'm';
};

/* ── the status the SERVER decided (s.status) ──────────────────────────────
   The 8-state machine lives in resolveStatus() on the server: it reads run.pid
   liveness + the loop.log phase markers + calibration and picks ONE honest
   state (sweeping / fixing / comparing / stopped / finished / unverified /
   idle). The client no longer re-derives it from live.status — it renders
   s.status as-is, so Finished-but-unverified can never be flattened into
   Finished here. Pure presentation; decides nothing. */
function statusView(s) {
  const st = (s && s.status) || {};
  return {
    k: st.key || 'idle',
    head: st.plain || st.headline || 'Idle',
    lines: [...(st.lines || []), ...(st.warn ? [st.warn] : [])],
    elapsedSec: st.elapsedSec,
    spent: st.spentUsd,
  };
}

/* ── plain-English blockers ─────────────────────────────────────────────── */
const BLOCKER = {
  'tree clean'     : 'Commit your changes first',
  'claude on PATH' : 'Claude Code is not installed',
  'app :3001 up'   : 'Start the app on :3001 first',
  'a queued item'  : 'Nothing in the queue yet',
  'prices frozen'  : 'Prices are moving — wait',
};
const NEEDS = {
  pair    : 'needs which two tickers',
  observed: 'needs what it shows now',
  expected: 'needs what it should show instead',
  source  : 'needs how you know',
};

// "Add a bug" is gone — the panel lives on the Dashboard; a duplicate nav item was just confusing.
function Sidebar({ page, setPage }) {
  const item = (name) => {
    const id = name.toLowerCase();
    return <div key={id} className={'navItem' + (page === id ? ' on' : '')}
      style={{cursor:'pointer'}} onClick={()=>setPage(id)}>{name}</div>;
  };
  return (
    <div className="side">
      <div className="avatar"></div>
      <div className="nav">{['Dashboard','Bugs','History'].map(item)}</div>
      <div className="navFoot">{item('Settings')}</div>
    </div>
  );
}

function Toggle({ on, disabled, onClick }) {
  return (
    <div className="toggle" onClick={disabled ? undefined : onClick}
      style={{background: on ? '#4B7A1F' : '#2A2A2A', cursor: disabled ? 'default' : 'pointer', opacity: disabled ? 0.45 : 1}}>
      <div className="knob" style={{left: on ? 21 : 3}} />
    </div>
  );
}

function SettingsPage() {
  const [rows, setRows] = useState(null);
  const [edit, setEdit] = useState({});
  const [jobs, setJobs] = useState(null);
  const [saved, setSaved] = useState(false);
  const [err, setErr] = useState({});
  const load = useCallback(() => {
    fetch('/api/settings').then(r=>r.json()).then(d=>{ setRows(d.settings || []); setEdit({}); }).catch(()=>{});
    fetch('/api/launchd').then(r=>r.json()).then(setJobs).catch(()=>{});   // REAL state, read on every open — never cached
  }, []);
  useEffect(load, [load]);
  const dirty = Object.keys(edit).some(k => edit[k] != null && edit[k] !== '');
  const save = () => {
    const patch = {};
    Object.keys(edit).forEach(k => { if (edit[k] != null && edit[k] !== '') patch[k] = edit[k]; });
    post('/api/settings', patch).then(d => { if (d.settings) { setRows(d.settings); setEdit({}); setSaved(true); } });
  };
  const toggle = (j) => {
    setErr(e => ({ ...e, [j.key]: null }));
    post('/api/launchd', { key: j.key, on: !j.loaded })
      .then(d => { if (d.error) setErr(e => ({ ...e, [j.key]: d.error })); })
      .finally(() => fetch('/api/launchd').then(r=>r.json()).then(setJobs).catch(()=>{}));   // re-read REAL state
  };
  if (!rows) return <div className="panel">loading…</div>;
  return (
    <div className="row col">
      <div className="panel">
        <div className="secLabel">Run settings</div>
        <div className="secSub">These used to live inside a script. The runner reads them from here now.</div>
        <div style={{marginTop:12}}>
          {rows.map(r => (
            <div className="setRow" key={r.key}>
              <div style={{flex:1,minWidth:0}}>
                <div className="setLabel">{r.label}</div>
                <div className="setExplain">{r.readOnly ? r.readOnlyWhy : r.explain}</div>
              </div>
              <div className="setCtrl">
                {r.kind === 'money' && <span className="setPrefix">$</span>}
                {/* read-only settings render as a VALUE, not a disabled input — a greyed-out box still reads
                    as "you may change this later"; plain text reads as "this is not set here". */}
                {r.readOnly
                  ? <span className="setInput" style={{border:'none',background:'none',textAlign:'right',opacity:0.75}}>{r.display}</span>
                  : <input className="setInput" type="number" min="0"
                      value={edit[r.key] != null ? edit[r.key] : r.display}
                      onChange={e => { setSaved(false); setEdit(x => ({ ...x, [r.key]: e.target.value })); }} />}
              </div>
            </div>
          ))}
        </div>
        <div style={{marginTop:14,display:'flex',alignItems:'center',gap:12}}>
          <button className="btn solid" onClick={save} disabled={!dirty}>Save</button>
          {saved && !dirty && <span className="addTally">saved</span>}
          <span className="addTally" style={{marginLeft:'auto',textAlign:'right'}}>An env var at launch (e.g. BUDGET_USD=8) still wins for that one run.</span>
        </div>
      </div>

      <div className="panel">
        <div className="secLabel">Automatic jobs</div>
        <div className="secSub">macOS launchd jobs. The state shown is read live from launchctl each time you open this — not remembered.</div>
        <div style={{marginTop:12}}>
          {(jobs ? jobs.jobs : []).map(j => {
            const blocked = err[j.key] || !j.controllable;
            const cmd = j.loaded ? j.offCmd : j.onCmd;
            return (
              <div className="setRow" key={j.key}>
                <div style={{flex:1,minWidth:0}}>
                  <div className="setLabel">{j.title}</div>
                  <div className="setExplain">{j.explain}</div>
                  {blocked && <div className="setExplain" style={{color:'#C98A88',marginTop:5}}>
                    {err[j.key] ? err[j.key] : (!j.hasPlist ? "Can't toggle from here — plist not installed" : "Can't toggle from here")} — run: <code>{cmd}</code>
                  </div>}
                </div>
                <div style={{display:'flex',alignItems:'center',gap:10,flex:'0 0 auto'}}>
                  <span className="addTally">{j.loaded ? 'On' : 'Off'}</span>
                  <Toggle on={j.loaded} disabled={!j.controllable} onClick={() => toggle(j)} />
                </div>
              </div>
            );
          })}
          {jobs && !jobs.available &&
            <div className="setExplain" style={{color:'#C98A88',marginTop:10}}>launchctl isn't reachable from the dashboard here — these are read-only; run the commands above from a terminal.</div>}
        </div>
      </div>
    </div>
  );
}

function BugsPage({ queue }) { return <QueuePanel queue={queue} />; }
function HistoryPage({ runs }) { return <PastRuns runs={runs} />; }

function StatusCard({ view }) {
  const c = STATE[view.k] || STATE.idle;
  const el = fmtElapsed(view.elapsedSec);
  const meta = view.k === 'idle' ? '' : [el, view.spent != null ? money(view.spent) : null].filter(Boolean).join(' · ');
  return (
    <div className="status" style={{background:c.bg}}>
      <div className="stTop">
        <div className="stLabel" style={{color:c.label}}>{c.name}</div>
        {meta && <div className="stMeta" style={{color:c.label}}>{meta}</div>}
      </div>
      <div className="stHead">{view.head}</div>
      {(view.lines || []).map((l,i)=><div key={i} className="stSub" style={{color:c.sub}}>{l}</div>)}
    </div>
  );
}

function Tile({ num, suffix, label }) {
  return (
    <div className="tile">
      <div className="tileNum">{num}{suffix && <span className="tileSuf">{suffix}</span>}</div>
      <div className="tileLab">{label}</div>
    </div>
  );
}

function Feed({ tail }) {
  const lines = (tail || []).filter(l => l && l.trim());
  const newest = lines.slice(-40).reverse();          // newest first, so the live line never needs scrolling
  return (
    <div className="panel feed">
      <div className="secLabel">Live feed</div>
      <div className="feedBody">
        {newest.length === 0 ? <div className="feedLine">(nothing yet)</div>
          : newest.map((l,i)=><div key={i} className={'feedLine' + (i===0 ? ' now' : '')}>{l}</div>)}
      </div>
    </div>
  );
}

function LaunchCard({ pf, running, budget, stopExists, refresh, undo }) {
  const [armed, setArmed] = useState(false);
  const [stopArmed, setStopArmed] = useState(false);
  const [showUndo, setShowUndo] = useState(false);
  useEffect(()=>{ if(!armed) return; const t=setTimeout(()=>setArmed(false),5000); return ()=>clearTimeout(t); },[armed]);
  useEffect(()=>{ if(!stopArmed) return; const t=setTimeout(()=>setStopArmed(false),5000); return ()=>clearTimeout(t); },[stopArmed]);

  const queued = (pf && pf.queued) || 0;
  const failed = pf ? pf.checks.filter(c=>!c.ok) : [];
  const ready = !!(pf && pf.allOk) && !running;
  let text;
  if (!pf) text = 'Checking…';
  else if (running) text = 'A run is already going';
  else if (failed.length) text = BLOCKER[failed[0].name] || ('Blocked: ' + failed[0].name);
  else text = armed ? 'Press again to start' : `Start on ${plural(queued,'bug')}`;

  const click = () => {
    if (!ready) return;
    if (!armed) { setArmed(true); return; }
    post('/api/launch', {}).then(d=>{ setArmed(false); if(d.error) alert('launch refused: '+d.error); refresh(); });
  };
  const toggleStop = () => {
    if (stopExists) { fetch('/api/stop',{method:'DELETE'}).then(refresh); return; }
    if (!stopArmed) { setStopArmed(true); return; }
    post('/api/stop', {}).then(()=>{ setStopArmed(false); refresh(); });
  };
  return (
    <div className="launch">
      <button className="launchBtn" onClick={click} disabled={!ready}
        title={failed.length ? failed.map(c=>`${c.name}: ${c.detail}`).join(' · ') : ''}>{text}</button>
      <div className="capNote">Stop at ${budget}</div>
      <div className="miniRow">
        <button className={'mini' + (stopArmed ? ' armed' : '')} onClick={toggleStop}>
          {stopExists ? 'Clear the stop flag' : stopArmed ? 'Press again to stop' : 'Stop after this item'}
        </button>
        {undo && <button className="mini" onClick={()=>setShowUndo(v=>!v)}>{showUndo ? 'Hide undo' : 'Undo last run'}</button>}
      </div>
      {showUndo && undo && <div className="undoBox">{undo.split('\n').filter(l=>l&&!l.startsWith('#')).join('\n')}</div>}
    </div>
  );
}

// Reads the REAL queue — agent/QUEUE.md (s.queue), the same source the "Bugs queued" tile counts. It used
// to read plan.json (the paste-staging area, usually empty), so the panel said "Nothing here yet" while the
// tile said "5 queued". One source now.
function QueuePanel({ queue }) {
  const items = queue || [];
  const pillFor = st => st === 'working' ? 'NOW' : st === 'done' ? 'DONE' : st === 'parked' ? 'SKIP' : 'WAIT';
  return (
    <div className="panel">
      <div className="secLabel">What the agent will work on</div>
      <div className="secSub">In order, from the queue. Each one has to reproduce before it gets touched.</div>
      <div style={{marginTop:10}}>
        {items.length === 0
          ? <div className="qEmpty">Nothing in the queue.</div>
          : items.map((it,i)=>{ const p = pillFor(it.state); return (
              <div className="qRow" key={i} style={{alignItems:'flex-start'}}>
                <span className="pill" style={{...(PILL[p] || PILL.WAIT), marginTop:1}}>{p}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div className={'qTitle' + (it.state==='working' ? ' on' : '')}>{it.title}</div>
                  {it.caveat && <div className="secSub" style={{marginTop:3,whiteSpace:'normal'}}>{it.caveat}</div>}
                </div>
                <span className="qPair" style={{marginTop:1}}>{it.pair || '—'}</span>
              </div>
            ); })}
      </div>
    </div>
  );
}

function AddBug({ open, setOpen, onQueue }) {
  const [text, setText] = useState('');
  const [res, setRes] = useState(null);
  const [saved, setSaved] = useState(false);
  useEffect(()=>{ setRes(null); setSaved(false); }, [text]);
  const check = () => post('/api/parse', { text }).then(d => { setRes(d); setSaved(false); });
  const add = () => post('/api/plan', { text }).then(d => { setRes(d); setSaved(true); onQueue(); });

  if (!open) return (
    <div className="panel strip" onClick={()=>setOpen(true)}>
      <span className="stripTitle">Add a bug</span>
      <span className="stripHint">not queued yet</span>
    </div>
  );

  const items = (res && res.items) || [];
  const ready = items.filter(i => i.status !== 'blocked').length;
  const needs = items.filter(i => i.status === 'blocked').length;
  return (
    <div className="panel">
      <div className="addHead">
        <h3>Add a bug</h3>
        <span style={{marginLeft:'auto',fontSize:11,color:'var(--t-5)'}}>{saved ? 'added to the list' : 'not queued yet'}</span>
      </div>
      <div className="addInstr">One bug per line. Each needs four things: which two tickers, what it shows now,
        what it should show, and how you know.</div>
      <textarea rows={6} value={text} onChange={e=>setText(e.target.value)}
        placeholder={"AAPL/VZ combined gross margin shows 36.2%, should be 46.6% per §16"} />
      <div className="addBtns">
        <button className="btn ghost" onClick={check} disabled={!text.trim()}>Check it</button>
        <button className="btn solid" onClick={add} disabled={!text.trim()}>Add to the list</button>
        {res && <span className="addTally">{ready} ready · {needs} need{needs===1?'s':''} more detail</span>}
      </div>
      {res && items.length > 0 &&
        <div className="addResults">
          {items.map((it,i)=>{
            const bad = it.status === 'blocked';
            const why = (it.missing || []).map(m => NEEDS[m] || m).join(', ');
            return (
              <div className="resRow" key={i}>
                <span className="pill" style={bad ? {background:'#3A3A3A',color:'#8A8A8A'} : {background:'#4B7A1F',color:'#0D0D0D'}}>
                  {bad ? 'NEEDS' : 'READY'}
                </span>
                <span className="resText">
                  {it.desc || it.pair || 'untitled'}
                  {bad && <span className="resWhy"> — {why}</span>}
                </span>
              </div>
            );
          })}
        </div>}
      <div style={{marginTop:12}}>
        <button className="mini" style={{color:'var(--t-5)'}} onClick={()=>setOpen(false)}>Close</button>
      </div>
    </div>
  );
}

function PastRuns({ runs }) {
  const list = runs || [];
  return (
    <div className="panel runs">
      <div className="secLabel">Past runs</div>
      <div style={{marginTop:8}}>
        {list.length === 0 ? <div className="qEmpty">No runs yet.</div>
          : list.slice(0,6).map((r,i)=>(
            <div className="runRow" key={i}>
              <span className="runDate">{r.date}</span>
              <span className="runDesc">{r.desc}</span>
              <span className="runCost">{money(r.cost)}</span>
            </div>
          ))}
      </div>
    </div>
  );
}

function App() {
  const [s, setS] = useState(null);
  const [pf, setPf] = useState(null);
  const [addOpen, setAddOpen] = useState(false);
  const [page, setPage] = useState('dashboard');
  const refreshState = useCallback(()=>fetch('/api/state').then(r=>r.json()).then(setS).catch(()=>{}),[]);
  const refreshPf = useCallback(()=>fetch('/api/preflight').then(r=>r.json()).then(setPf).catch(()=>{}),[]);
  useEffect(()=>{ refreshState(); refreshPf();
    const a=setInterval(refreshState,2000), b=setInterval(refreshPf,15000);
    return ()=>{clearInterval(a);clearInterval(b);}; },[refreshState,refreshPf]);
  const refresh = useCallback(()=>{ refreshState(); refreshPf(); },[refreshState,refreshPf]);

  if (!s) return <div className="page"><Sidebar page={page} setPage={setPage} /><div className="main"><div className="panel">loading…</div></div></div>;

  const view = statusView(s);
  const live = s.live || {}, sum = s.summary || {}, st = live.status || {};
  const running = ['sweeping','fixing','comparing'].includes(view.k);
  const before = sum.defectsBefore, after = sum.defectsAfter;
  const foundNum = before == null ? '—' : String(before);
  const foundSuf = before == null ? '' : '→ ' + (running || after == null ? '?' : String(after));
  const waiting = pf ? pf.queued : 0;

  const TITLES = { dashboard:'Bug Fixer', bugs:'Bugs', history:'History', settings:'Settings' };
  const TAGS = { dashboard:"Fix the deck, don't babysit the script.", bugs:'Everything waiting, in order.',
    history:'Every run, honestly.', settings:'Change it here instead of from the terminal.' };

  return (
    <div className="page">
      <Sidebar page={page} setPage={setPage} />
      <div className="main">
        <div className="head">
          <h1>{TITLES[page] || 'Bug Fixer'}</h1>
          <span className="tag">{TAGS[page] || ''}</span>
        </div>

        {page === 'settings' ? <SettingsPage />
         : page === 'bugs' ? <BugsPage queue={s.queue} />
         : page === 'history' ? <HistoryPage runs={s.pastRuns} />
         : (<React.Fragment>
            <div className="row">
              <StatusCard view={view} />
              <div className="tiles">
                <Tile num={foundNum} suffix={foundSuf} label="Problems found" />
                {running
                  ? <Tile num={st.iter || 1} suffix={'of ' + waiting} label="Bug being worked" />
                  : <Tile num={waiting} label="Bugs queued" />}
              </div>
            </div>

            <div className="row">
              <Feed tail={live.logTail} />
              <LaunchCard pf={pf} running={running} budget={s.budgetUsd} stopExists={s.stopExists}
                refresh={refresh} undo={s.undo} />
            </div>

            <QueuePanel queue={s.queue} />

            <div className={'row top' + (addOpen ? ' col' : '')}>
              <AddBug open={addOpen} setOpen={setAddOpen} onQueue={refresh} />
              <PastRuns runs={s.pastRuns} />
            </div>
          </React.Fragment>)}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
