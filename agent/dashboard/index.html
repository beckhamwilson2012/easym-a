<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sweep Dashboard</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#c9d1d9; --dim:#8b949e; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; }
  h1 { font-size:18px; margin:0; } h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); margin:0 0 10px; }
  .wrap { max-width:900px; margin:0 auto; padding:16px; }
  .top { display:flex; align-items:center; gap:14px; border-bottom:1px solid var(--border); padding-bottom:12px; margin-bottom:16px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:16px; }
  .mono { font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; }
  textarea { width:100%; background:#010409; color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:10px; font:12px/1.5 ui-monospace,Menlo,monospace; }
  button { background:#21262d; color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:7px 14px; cursor:pointer; font-size:13px; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .dim { color:var(--dim); } .good { color:#3fb950; } .bad { color:#f85149; } .warn { color:#e3b341; }
  .log { background:#010409; border:1px solid var(--border); border-radius:6px; padding:10px; max-height:280px; overflow:auto; white-space:pre-wrap; }
  .row { display:flex; align-items:center; gap:10px; padding:7px 4px; border-bottom:1px solid var(--border); }
  .row.done { opacity:.55; }
  .dot { width:11px; height:11px; border-radius:50%; flex:0 0 auto; }
  .pill { padding:1px 9px; border-radius:10px; font-size:11px; font-weight:700; margin-left:auto; }
  .pair { font:12px/1 ui-monospace,Menlo,monospace; font-weight:700; min-width:110px; }
  .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .card { background:#0d1117; border:1px solid var(--border); border-radius:6px; padding:10px; }
  .card .k { color:var(--dim); font-size:11px; text-transform:uppercase; } .card .v { font-size:22px; font-weight:700; }
  .pf { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; margin-bottom:10px; }
  .pf span::before { content:'✓ '; color:#3fb950; } .pf span.no::before { content:'✗ '; color:#f85149; }
  .pf span.no { color:#f85149; }
  code.copy { background:#010409; border:1px solid var(--border); border-radius:6px; padding:8px 10px; display:block; word-break:break-all; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const ST = {
  done:    { color:'#3fb950', fill:true,  pill:'rgba(63,185,80,.15)' },
  running: { color:'#58a6ff', fill:true,  pill:'rgba(88,166,255,.15)' },
  queued:  { color:'#8b949e', fill:false, pill:'rgba(139,148,158,.10)' },
  blocked: { color:'#e3b341', fill:true,  pill:'rgba(227,179,65,.15)' },
  skipped: { color:'#57606a', fill:false, pill:'rgba(87,96,106,.10)' },
};
const post = (url, body) => fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{}) }).then(r=>r.json());
const fmtDur = s => s==null?'—':(s>=3600?(s/3600).toFixed(1)+'h':s>=60?Math.floor(s/60)+'m '+(s%60)+'s':s+'s');

function PastePlan({ onQueue }) {
  const [text, setText] = useState('');
  const [prev, setPrev] = useState(null);
  const parse = () => post('/api/parse', { text }).then(setPrev);
  const add = () => post('/api/plan', { text }).then(d => { setPrev(d); onQueue(); });
  return (
    <div className="panel">
      <h2>Paste plan</h2>
      <div style={{marginBottom:8}}>Paste your plan. Each item needs a ticker pair, what it shows now, what it should show, and where you know that from.</div>
      <textarea rows={7} value={text} onChange={e=>setText(e.target.value)}
        placeholder={"AAPL/VZ combined gross margin shows 36.2%, should be 46.6% per §16"} />
      <div className="dim" style={{marginTop:6,fontSize:12}}>Anything missing gets parked, not queued — nothing is guessed.</div>
      <div style={{marginTop:8, display:'flex', gap:8}}>
        <button onClick={parse} disabled={!text.trim()}>Parse preview</button>
        <button onClick={add} disabled={!text.trim()}>Add to queue</button>
      </div>
      {prev && <div style={{marginTop:10}}>
        {prev.summary.map((l,i)=><div key={i} className={i===0?'':'warn'} style={{fontWeight:i===0?700:400}}>{l}</div>)}
        <div className="dim" style={{marginTop:4,fontSize:12}}>Preview only — "Add to queue" appends to the working queue (append-only; existing items kept). QUEUE.md is written only on launch.</div>
      </div>}
    </div>
  );
}

function Queue({ plan }) {
  const items = (plan && plan.items) || [];
  const c = (plan && plan.counts) || {};
  return (
    <div className="panel">
      <h2>Queue — {c.done||0} done · {c.running||0} running · {c.queued||0} queued · {c.blocked||0} blocked{c.skipped?` · ${c.skipped} skipped`:''}</h2>
      {items.length===0 ? <div className="dim">Empty — paste a plan above.</div> :
        items.map((it,i)=>{ const s = ST[it.status]||ST.queued; return (
          <div key={i} className={'row'+(it.status==='done'?' done':'')}>
            <span className="dot" style={{background:s.fill?s.color:'transparent', border:'2px solid '+s.color}}></span>
            <span className="pair">{it.pair||'—'}</span>
            <span>{it.desc}{it.status==='blocked'&&it.missing&&it.missing.length? <span className="warn" style={{fontSize:12}}> — missing {it.missing.join(', ')}{it.missing.length===3?' (a pair alone is not a repro)':''}</span>:null}</span>
            <span className="pill" style={{background:s.pill, color:s.color}}>{it.status}</span>
          </div>
        );})}
    </div>
  );
}

function Launch({ pf, plan, refresh }) {
  const [armed, setArmed] = useState(false);
  useEffect(()=>{ if(!armed) return; const t=setTimeout(()=>setArmed(false),5000); return ()=>clearTimeout(t); },[armed]);
  const queued = (pf && pf.queued) || 0;
  const budget = (pf && pf.budgetUsd) || 0;
  const ready = pf && pf.allOk;
  const failed = pf ? pf.checks.filter(c=>!c.ok) : [];
  const click = () => {
    if (!ready) return;
    if (!armed) { setArmed(true); return; }
    post('/api/launch', {}).then(d=>{ setArmed(false); if(d.error){ alert('launch refused: '+d.error); } refresh(); });
  };
  return (
    <div className="panel">
      <h2>Launch</h2>
      <div className="pf">
        {pf ? pf.checks.map((c,i)=><span key={i} className={c.ok?'':'no'} title={c.detail}>{c.name}</span>) : <span className="dim">checking…</span>}
      </div>
      {!ready && failed.length>0 && <div className="bad" style={{marginBottom:8,fontSize:13}}>blocked by: {failed.map(c=>`${c.name} (${c.detail})`).join(' · ')}</div>}
      <button onClick={click} disabled={!ready}
        style={armed?{borderColor:'#f85149',background:'#3d1b1b'}:{}}>
        {armed ? `Confirm — ${queued} item${queued===1?'':'s'}, $${budget} cap` : `Launch ${queued} queued`}
      </button>
      <span className="dim" style={{marginLeft:10,fontSize:12}}>blocked &amp; parked items are excluded{armed?' · click again within 5s to start':' · two clicks to start'}</span>
    </div>
  );
}

function Summary({ summary }) {
  const s = summary || {};
  const d = s.decisions || [];
  return (
    <div className="panel">
      <h2>Summary</h2>
      <div className="cards">
        <div className="card"><div className="k">Committed</div><div className="v good">{s.committed||0}</div></div>
        <div className="card"><div className="k">Reverted</div><div className="v bad">{s.reverted||0}</div></div>
        <div className="card"><div className="k">Defects</div><div className="v">{s.defectsBefore==null?'—':`${s.defectsBefore}→${s.defectsAfter}`}</div></div>
        <div className="card"><div className="k">Spent</div><div className="v">${(s.spent||0).toFixed(2)}</div></div>
      </div>
      <div style={{marginTop:12}}>
        {d.length===0 ? <div className="dim">No decisions yet — populates from calibration.csv + the branch commit log during a run.</div> :
          d.map((x,i)=> x.status==='DONE'||x.status==='RESOLVED_UPSTREAM'
            ? <div key={i} className="mono good">commit {x.sha} · {x.item}</div>
            : <div key={i} className="mono bad" style={{fontWeight:700}}>revert {x.item}{x.defects?` · defects ${x.defects}`:''} [{x.status}]</div>)}
      </div>
    </div>
  );
}

function LiveView({ live, summary, budget, undo }) {
  const st = (live && live.status) || {};
  const rs = st.runState;                          // RUNNING/COMPLETED/DIED/STALE, or undefined when no run
  const hasRun = !!(live && live.loopLogExists);
  const active = rs === 'RUNNING';
  const DOT = { RUNNING:'#58a6ff', STALE:'#e3b341', DIED:'#f85149', COMPLETED:'#3fb950' }[rs] || '#8b949e';
  const pairsDone = (live && live.pairsDone) || 0, pairsTotal = (live && live.pairsTotal) || 50;
  const frac = pairsTotal ? Math.min(1, pairsDone/pairsTotal) : 0;
  const elapsedM = live && live.elapsedSec!=null ? Math.floor(live.elapsedSec/60) : null;
  const spent = (summary && summary.spent) || 0;
  const committed = (summary && summary.committed) || 0, reverted = (summary && summary.reverted) || 0;
  const outcome = hasRun ? (committed + ' committed' + (reverted ? `, ${reverted} reverted` : '')) : 'no runs yet';
  const hair = { marginTop:8, borderTop:'1px solid var(--border)', paddingTop:8 };
  const sum = { cursor:'pointer', fontSize:12, display:'flex', alignItems:'center' };
  return (
    <div className="panel">
      {/* 1 — status line */}
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <span style={{width:9,height:9,borderRadius:'50%',background:DOT,display:'inline-block'}}></span>
        <span style={{letterSpacing:'.14em',fontSize:12,fontWeight:700}}>{hasRun ? (rs||'RUNNING') : 'IDLE'}</span>
        <span className="mono dim" style={{marginLeft:'auto',fontSize:11}}>{st.runId||''}</span>
      </div>
      {/* 2 — time remaining headline (or last outcome when idle) */}
      <div style={{display:'flex',alignItems:'baseline',marginTop:10}}>
        {active && st.minLeft!=null
          ? <><span style={{fontSize:40,fontWeight:300,lineHeight:1}}>{st.minLeft}</span><span style={{fontSize:15,marginLeft:8,color:'var(--dim)'}}>min left</span></>
          : <span style={{fontSize:32,fontWeight:300,lineHeight:1}}>{outcome}</span>}
        {active && st.endClock && <span style={{marginLeft:'auto',fontSize:13,color:'var(--dim)'}}>done ~{st.endClock}</span>}
      </div>
      {(rs==='STALE'||rs==='DIED') && <div className="bad" style={{marginTop:8,fontSize:13}}>
        {rs==='DIED' ? 'process not alive, no completion line — this run is DEAD.' : 'no log write in >30 min — capture may be hung.'} last line: <span className="mono">{st.lastLogLine||'—'}</span></div>}
      {/* 3 — progress bar (hidden when not active) */}
      {active && <div style={{height:4,background:'#010409',borderRadius:2,marginTop:12,overflow:'hidden'}}>
        <div style={{height:'100%',width:(frac*100)+'%',background:'var(--accent)',transition:'width .5s'}}></div></div>}
      {/* 4 — phase line */}
      {active && <div style={{display:'flex',fontSize:12,color:'var(--dim)',marginTop:6}}>
        <span>{st.phase||'Working'} · {pairsDone} of {pairsTotal} pairs</span>
        <span style={{marginLeft:'auto'}}>{elapsedM!=null?elapsedM+'m elapsed':''}</span></div>}
      {/* 5 — stat row */}
      <div style={{display:'flex',gap:22,fontSize:12,marginTop:12}}>
        <span><span className="dim">Item </span><b>{st.iter||'—'} of {st.openItems||'?'}</b></span>
        <span><span className="dim">Spent </span><b>${spent.toFixed(2)}</b></span>
        <span><span className="dim">Cap </span><b>${budget!=null?(+budget).toFixed(0):'?'}</b></span>
      </div>
      {/* 6 — disclosures (collapsed by default) */}
      <details style={hair}>
        <summary style={sum}>Log<span className="mono dim" style={{marginLeft:'auto',maxWidth:'62%',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{st.lastLogLine||''}</span></summary>
        <div className="log mono" style={{marginTop:8}}>{((live&&live.logTail)||[]).join('\n')||'(empty)'}</div>
      </details>
      <details style={hair}>
        <summary style={sum}>Undo command<span className="dim" style={{marginLeft:'auto'}}>discards this run</span></summary>
        <code className="copy mono" style={{marginTop:8,display:'block'}}>{undo?undo.split('\n').filter(l=>l&&!l.startsWith('#')).join('\n'):'(no run)'}</code>
      </details>
    </div>
  );
}

function App() {
  const [s, setS] = useState(null);
  const [pf, setPf] = useState(null);
  const refreshState = useCallback(()=>fetch('/api/state').then(r=>r.json()).then(setS).catch(()=>{}),[]);
  const refreshPf = useCallback(()=>fetch('/api/preflight').then(r=>r.json()).then(setPf).catch(()=>{}),[]);
  useEffect(()=>{ refreshState(); refreshPf(); const a=setInterval(refreshState,2000); const b=setInterval(refreshPf,15000); return ()=>{clearInterval(a);clearInterval(b);}; },[refreshState,refreshPf]);
  if (!s) return <div className="wrap">loading…</div>;
  return (
    <div className="wrap">
      <div className="top">
        <h1>Sweep Dashboard</h1>
        <span className="dim">run <b>{s.latestRun||'—'}</b></span>
        <span style={{marginLeft:'auto'}} className="dim">{s.stopExists?<b className="warn">STOP set</b>:''}</span>
      </div>
      <PastePlan onQueue={()=>{refreshState();refreshPf();}} />
      <Queue plan={s.plan} />
      <Launch pf={pf} plan={s.plan} refresh={()=>{refreshState();refreshPf();}} />
      <Summary summary={s.summary} />
      <LiveView live={s.live} summary={s.summary} budget={s.budgetUsd} undo={s.undo} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
